<style>
    /* Arama Ekranı (Arka Plan) */
    .search-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
        background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
        z-index: 9999; display: flex; justify-content: center; align-items: flex-start;
        opacity: 0; visibility: hidden; transition: 0.3s ease; padding-top: 10vh;
    }
    
    /* Görünür Olma Sınıfı */
    .search-overlay.active { opacity: 1; visibility: visible; }
    
    /* Arama Kutusu ve Sonuçların Çerçevesi */
    .search-container {
        width: 90%; max-width: 650px; background: var(--card-bg);
        border-radius: 20px; padding: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        display: flex; flex-direction: column; max-height: 80vh; border: 1px solid var(--border);
    }
    
    /* Arama Çubuğu Kısmı */
    .search-header { display: flex; gap: 15px; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
    .search-header i.bx-search { font-size: 1.8rem; color: var(--primary); }
    
    #searchInput {
        flex: 1; border: none; outline: none; background: transparent;
        font-size: 1.3rem; color: var(--text); font-family: 'Inter', sans-serif;
    }
    #searchInput::placeholder { color: var(--text-muted); opacity: 0.7; }
    
    #closeSearch {
        background: var(--accent); border: none; width: 35px; height: 35px; border-radius: 50%;
        font-size: 1.5rem; color: var(--text); cursor: pointer; transition: 0.2s;
        display: flex; align-items: center; justify-content: center;
    }
    #closeSearch:hover { background: #ff4757; color: white; transform: rotate(90deg); }
    
    /* Sonuçların Listelendiği Alan */
    .search-results { overflow-y: auto; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
    .search-results::-webkit-scrollbar { width: 6px; }
    .search-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    
    /* Tekil Sonuç Kartı */
    .search-item {
        display: flex; align-items: center; gap: 15px; padding: 12px;
        border-radius: 12px; transition: 0.2s; text-decoration: none; color: var(--text);
        border: 1px solid transparent;
    }
    .search-item:hover { background: var(--accent); border-color: var(--border); transform: translateX(5px); }
    .search-item img { width: 65px; height: 65px; object-fit: cover; border-radius: 10px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .search-item-info h4 { margin: 0 0 6px 0; font-size: 1.05rem; line-height: 1.3; }
    .search-item-info span { font-size: 0.75rem; color: white; background: var(--primary); padding: 3px 8px; border-radius: 20px; font-weight: bold; text-transform: uppercase; }
    .no-result { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 1.1rem; }
</style>

<div id="searchOverlay" class="search-overlay">
    <div class="search-container">
        <div class="search-header">
            <i class='bx bx-search'></i>
            <input type="text" id="searchInput" placeholder="Dükkanda ne arıyorsunuz? (Örn: Anksiyete)" autocomplete="off">
            <button id="closeSearch"><i class='bx bx-x'></i></button>
        </div>
        <div id="searchResults" class="search-results">
            </div>
    </div>
</div>

<script>
    // JEKYLL VERİ TABANI (Tüm yazıları JS hafızasına alıyoruz)
    const diveData = [
        {% for post in site.posts %}
        {
            title: {{ post.title | jsonify }},
            url: "{{ site.url }}{{ post.url }}",
            category: {{ post.kategori | default: 'Genel' | jsonify }},
            image: "{{ post.image }}"
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
    ];

    document.addEventListener("DOMContentLoaded", function() {
        // 1. ADIM: MENÜYE BÜYÜTEÇ BUTONUNU "HACK" İLE EKLEME (Ana dosyayı bozmadan)
        const headerInner = document.querySelector('.header-inner');
        const themeSwitch = document.getElementById('theme-switch');
        
        if (headerInner && themeSwitch) {
            const searchBtn = document.createElement('button');
            searchBtn.className = 'theme-switch'; // Ay ikonuyla aynı tasarımı alır
            searchBtn.id = 'openSearch';
            searchBtn.innerHTML = "<i class='bx bx-search'></i>";
            searchBtn.style.marginRight = "5px"; // Ay ile arasına hafif boşluk
            
            // Ay butonunun hemen soluna Büyüteci yerleştir
            headerInner.insertBefore(searchBtn, themeSwitch);
            
            // 2. ADIM: FONKSİYONLAR
            const overlay = document.getElementById('searchOverlay');
            const closeBtn = document.getElementById('closeSearch');
            const input = document.getElementById('searchInput');
            const resultsBox = document.getElementById('searchResults');

            // Açma
            searchBtn.addEventListener('click', () => {
                overlay.classList.add('active');
                input.value = ''; // Kutuyu temizle
                resultsBox.innerHTML = ''; // Sonuçları temizle
                setTimeout(() => input.focus(), 100); // İmleci kutuya koy
            });

            // Kapatma
            closeBtn.addEventListener('click', () => overlay.classList.remove('active'));
            // Dışarı tıklayınca kapatma
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });

            // 3. ADIM: CANLI ARAMA (KLAVYE DİNLEME)
            input.addEventListener('input', function() {
                const term = this.value.toLowerCase().trim();
                resultsBox.innerHTML = ''; // Önceki sonuçları sil
                
                if (term.length < 2) return; // En az 2 harf yazsın
                
                // Başlık veya kategoride kelimeyi ara
                const filtered = diveData.filter(post => 
                    post.title.toLowerCase().includes(term) || 
                    post.category.toLowerCase().includes(term)
                );
                
                if (filtered.length === 0) {
                    resultsBox.innerHTML = '<div class="no-result">Maalesef buna uygun bir yazı bulamadık. 🕵️‍♂️</div>';
                    return;
                }
                
                // Bulunanları Listele
                filtered.forEach(post => {
                    const item = document.createElement('a');
                    item.href = post.url;
                    item.className = 'search-item';
                    item.innerHTML = `
                        <img src="${post.image}" alt="Kapak">
                        <div class="search-item-info">
                            <h4>${post.title}</h4>
                            <span>${post.category}</span>
                        </div>
                    `;
                    resultsBox.appendChild(item);
                });
            });
        }
    });
</script>
