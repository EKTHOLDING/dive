<style>
    /* Renk geçişlerini yumuşat */
    body { transition: background-color 0.4s ease, color 0.4s ease; }
    .header { transition: background-color 0.4s ease; }
    
    /* Gece Modu Aktifken Çalışacak CSS Kodları */
    body.dark-mode { background-color: #121212; color: #e4e6eb; }
    body.dark-mode .header { background: rgba(18,18,18,0.95); border-bottom: 1px solid #333; }
    body.dark-mode .share-section { background: #1e1e1e; border-color: #333; }
    body.dark-mode .author-box { background: #242526; border-color: #333; }
    body.dark-mode .share-btn { background: #2a2a2a; color: #e4e6eb; border-color: #444; }
    body.dark-mode .share-btn:hover { background: var(--primary); color: white; }
    body.dark-mode .custom-footer { border-color: #333; }

    /* Buton Tasarımı */
    .theme-switch { background: none; border: none; color: inherit; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; padding: 5px; transition: transform 0.3s; margin-left: auto; }
    .theme-switch:hover { color: var(--primary); transform: scale(1.1); }
</style>

<script>
    // 1. Sayfa yüklenirken hafızayı kontrol et (Titremeyi önler)
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }

    // 2. Butona tıklandığında temayı değiştir
    document.addEventListener('DOMContentLoaded', () => {
        const themeSwitch = document.getElementById('theme-switch');
        const themeIcon = document.getElementById('theme-icon');
        
        // İkonu hafızaya göre ayarla
        if (document.body.classList.contains('dark-mode') && themeIcon) { 
            themeIcon.classList.replace('bx-moon', 'bx-sun'); 
        }

        if(themeSwitch) {
            themeSwitch.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                
                if (document.body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                    themeIcon.classList.replace('bx-moon', 'bx-sun');
                } else {
                    localStorage.setItem('theme', 'light');
                    themeIcon.classList.replace('bx-sun', 'bx-moon');
                }
            });
        }
    });
</script>
