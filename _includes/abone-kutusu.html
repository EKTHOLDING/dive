<style>
    /* Abone Kutusu Genel Tasarım */
    .newsletter-box {
        background: var(--card-bg);
        border: 2px solid var(--accent);
        border-radius: 24px;
        padding: 40px 30px;
        margin: 50px 0;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
    }
    
    /* Gece Modunda Çerçeve Belirginliği */
    body.dark-mode .newsletter-box {
        border-color: var(--border);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    /* İkon Tasarımı */
    .newsletter-icon {
        font-size: 3.5rem;
        color: var(--primary);
        margin-bottom: 15px;
        display: inline-block;
        animation: float 3s ease-in-out infinite;
    }
    
    /* Hafif Uçuşma Animasyonu */
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
    }

    .newsletter-title {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--text);
        margin: 0 0 10px 0;
        font-family: 'Playfair Display', serif;
    }
    
    .newsletter-desc {
        font-size: 1rem;
        color: var(--text-muted);
        margin: 0 auto 25px auto;
        line-height: 1.6;
        max-width: 550px;
    }
    
    /* Form Alanı */
    .newsletter-form {
        display: flex;
        gap: 12px;
        max-width: 500px;
        margin: 0 auto;
        position: relative;
    }
    
    .newsletter-input {
        flex: 1;
        padding: 16px 20px;
        border: 2px solid var(--border);
        border-radius: 50px;
        font-size: 1rem;
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        outline: none;
        transition: all 0.3s ease;
    }
    
    .newsletter-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 15px rgba(42, 157, 143, 0.1);
    }
    
    .newsletter-btn {
        padding: 16px 32px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .newsletter-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(42, 157, 143, 0.4);
        filter: brightness(1.1);
    }

    /* Mobil Uyum (Ekran daraldığında alt alta geç) */
    @media (max-width: 600px) {
        .newsletter-form {
            flex-direction: column;
        }
        .newsletter-btn {
            width: 100%;
            justify-content: center;
        }
        .newsletter-box {
            padding: 30px 20px;
        }
    }
</style>

<div class="newsletter-box">
    <div class="newsletter-icon">
        <i class='bx bx-envelope-open'></i>
    </div>
    <h3 class="newsletter-title">Yeni İçerikleri Kaçırmayın</h3>
    <p class="newsletter-desc">Psikoloji, üretkenlik ve zihinsel performans üzerine hazırladığımız en yeni derinlemesine makaleler, doğrudan e-posta kutunuza gelsin. (Spam yapmayız, sadece değer katarız!)</p>
    
    <form class="newsletter-form" onsubmit="event.preventDefault(); alert('Harika! E-posta altyapısı (Mailchimp vb.) kurulduğunda adresiniz güvenle kaydedilecek. Şimdilik tasarımın keyfini çıkarın!');">
        <input type="email" class="newsletter-input" placeholder="E-posta adresinizi girin..." required>
        <button type="submit" class="newsletter-btn">
            Abone Ol <i class='bx bx-send'></i>
        </button>
    </form>
</div>
