<style>
    #smart-top-newsletter {
        background: var(--card-bg);
        border: 2px solid var(--primary);
        border-radius: 15px;
        padding: 20px 25px;
        margin-bottom: 35px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        box-shadow: 0 8px 25px rgba(42, 157, 143, 0.15);
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.5s ease, transform 0.5s ease;
    }
    
    body.dark-mode #smart-top-newsletter { box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); }

    .top-news-text { flex: 1; display: flex; align-items: center; gap: 15px; }
    .top-news-icon { font-size: 2.5rem; color: var(--primary); }
    .top-news-content h4 { margin: 0 0 5px 0; font-size: 1.2rem; color: var(--text); font-weight: 800; }
    .top-news-content p { margin: 0; font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; }

    .top-news-form-wrapper { display: flex; gap: 10px; flex: 1; max-width: 450px; }
    .top-news-input { 
        flex: 1; padding: 12px 18px; border: 1px solid var(--border); border-radius: 8px; 
        outline: none; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; 
    }
    .top-news-btn { 
        background: var(--primary); color: white; border: none; padding: 0 20px; 
        border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; 
        display: flex; align-items: center; gap: 5px; min-height: 45px;
    }
    .top-news-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(42, 157, 143, 0.3); }

    /* Başarı Mesajı Stili */
    #ml-success-msg { display: none; color: var(--primary); font-weight: 700; font-size: 1.1rem; animation: pop 0.3s ease; }
    @keyframes pop { 0% {transform: scale(0.8);} 100% {transform: scale(1);} }

    @media (max-width: 768px) {
        #smart-top-newsletter { flex-direction: column; text-align: center; }
        .top-news-form-wrapper { width: 100%; flex-direction: column; }
    }
</style>

<div id="smart-top-newsletter">
    <div class="top-news-text">
        <i class='bx bx-envelope-open top-news-icon' id="news-main-icon"></i>
        <div class="top-news-content" id="news-content-area">
            <h4>DIVE Medya Bülteni</h4>
            <p>Derin içerikler e-postanıza gelsin.</p>
        </div>
        <div id="ml-success-msg">Aramıza hoş geldiniz! Kaydınız başarıyla alındı. 🎉</div>
    </div>

    <div class="top-news-form-wrapper" id="form-container">
        <input type="email" id="ml-email-input" class="top-news-input" placeholder="E-posta adresiniz..." required>
        <button type="button" id="ml-submit-btn" class="top-news-btn">Abone Ol</button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const newsletterBox = document.getElementById("smart-top-newsletter");
        const mainContent = document.querySelector(".main-content");
        const submitBtn = document.getElementById("ml-submit-btn");
        const emailInput = document.getElementById("ml-email-input");
        const formContainer = document.getElementById("form-container");
        const newsContent = document.getElementById("news-content-area");
        const successMsg = document.getElementById("ml-success-msg");
        const mainIcon = document.getElementById("news-main-icon");
        
        // Kutuyu tepeye taşı
        if (mainContent && newsletterBox) {
            mainContent.insertBefore(newsletterBox, mainContent.firstChild);
            setTimeout(() => { newsletterBox.style.opacity = "1"; newsletterBox.style.transform = "translateY(0)"; }, 100);
        }

        // BEYAZ SAYFAYI ENGELLEYEN ARKA KAPI GÖNDERİMİ
        if(submitBtn) {
            submitBtn.addEventListener("click", function() {
                const email = emailInput.value;
                if(!email || !email.includes('@')) {
                    alert("Lütfen geçerli bir e-posta adresi girin.");
                    return;
                }

                submitBtn.innerText = "Gönderiliyor...";
                submitBtn.disabled = true;

                // MailerLite'a veriyi çaktırmadan gönder
                const formData = new FormData();
                formData.append('fields[email]', email);

                fetch("https://assets.mailerlite.com/jsonp/2222287/forms/182950012981872574/subscribe", {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors' // Bu 'no-cors' sayesinde o beyaz başarı sayfasını görmüyoruz!
                }).then(() => {
                    // Sayfa değişmeden başarı mesajını göster
                    formContainer.style.display = "none";
                    newsContent.style.display = "none";
                    mainIcon.classList.replace('bx-envelope-open', 'bx-party');
                    successMsg.style.display = "block";
                }).catch(() => {
                    alert("Bir hata oluştu, lütfen tekrar deneyin.");
                    submitBtn.innerText = "Abone Ol";
                    submitBtn.disabled = false;
                });
            });
        }
    });
</script>
