<style>
    /* Ana kapak: Bütün ekranı kaplar, bembeyazdır */
    #dive-splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff; /* Pinterest gibi beyaz fon */
        z-index: 999999; /* Reklamların ve sitenin en üstünde durur */
        display: flex;
        justify-content: center; /* Logoyu yatayda ortala */
        align-items: center;    /* Logoyu dikeyde ortala */
        opacity: 1;
        transition: opacity 0.5s ease; /* Pürüzsüz kaybolma efekti */
    }

    /* Logo ayarı */
    #dive-splash-logo {
        width: 120px; /* Pinterest logosu gibi küçük ve asil */
        height: auto;
        animation: pulse 1.5s infinite ease-in-out; /* Hafif nabız atışı efekti */
    }

    /* Nabız animasyonu: App açılırken nefes alıyor gibi */
    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }
</style>

<div id="dive-splash-screen">
    <img src="/assets/images/logo.png" alt="DIVE" id="dive-splash-logo">
</div>

<script>
    // Sitenin her şeyi (görseller vs.) yüklenince bu motor çalışır
    window.addEventListener('load', function() {
        var splash = document.getElementById('dive-splash-screen');
        if (splash) {
            // 0.3 saniye bekle, sonra pürüzsüzce kaybol
            setTimeout(function() {
                splash.style.opacity = '0';
                // Animasyon bitince dosyayı ekrandan tamamen kaldır
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 500); 
            }, 300); 
        }
    });
</script>
