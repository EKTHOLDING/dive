<style>
    /* 1. Kök Değişkenler */
    :root {
        --primary-color: #B1976B !important;
        --theme-color: #B1976B !important;
        --main-color: #B1976B !important;
        --secondary-color: #B1976B !important;
        --color-primary: #B1976B !important;
    }

    /* 2. TÜM BAŞLIKLAR, "READ ARTICLE" ve "WELCOME" YAZILARI (İnatçı Yeşiller) */
    h1, h2, h3, h4, h5, h6, 
    .post-title, .post-title a, 
    .read-more, .read-more a, .more-link, .btn-link,
    .hero-title, .section-title, .page-title,
    .text-primary {
        color: #B1976B !important;
    }

    /* 3. İNATÇI ÇERÇEVELER (Bülten) ve İKONLAR (Zarf vs) */
    .subscribe-form, .newsletter-box, .newsletter-wrapper, 
    .card, .border-primary, form, input, .form-control {
        border-color: #B1976B !important;
    }
    
    /* Zarf ve diğer tüm küçük simgeler */
    svg, .icon, i, .fa, .fas, .far {
        color: #B1976B !important;
        fill: #B1976B !important;
    }

    /* 4. TEPEDEKİ BÜYÜTEÇ VE AY (Kareleri Buharlaştırıyoruz, Sadece İkon Kalacak) */
    .navbar button, .header button, 
    .nav-search-button, .dark-mode-toggle, 
    header .btn, nav .btn, 
    .search-toggle, .navbar-toggler {
        background: transparent !important; /* Arka planı tamamen yok et */
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 5px !important;
        color: #B1976B !important;
    }
    
    /* O ikonların boyutunu ve rengini asil bir hale getiriyoruz */
    .navbar button svg, .header button svg,
    .nav-search-button svg, .dark-mode-toggle svg {
        width: 22px !important;
        height: 22px !important;
        fill: #B1976B !important;
        transition: all 0.3s ease;
    }
    
    /* Üstüne gelince hafif büyüme efekti */
    .navbar button:hover svg, .header button:hover svg {
        transform: scale(1.1);
        fill: #C5A059 !important;
    }

    /* 5. Butonlar (Tümü, Abone Ol vb. Gold Kalacak) */
    .btn, .btn-primary, button[type="submit"], .tag, .category-tag, .active {
        background-color: #B1976B !important;
        border-color: #B1976B !important;
        color: #ffffff !important;
    }
    
    /* Üstteki ikonlar "btn" sınıfından etkilenip kare olmasın diye koruma kalkanı */
    header .btn, nav .btn, .navbar button, .header button {
        background-color: transparent !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var logoElements = document.querySelectorAll('.site-title, .navbar-brand, .logo');
        if(logoElements.length > 0) {
            logoElements[0].innerHTML = '<img src="/assets/images/logo.png" alt="DIVE" style="height: 45px; width: auto; object-fit: contain; margin-top: -5px;">';
        } else {
            var links = document.querySelectorAll('a[href="/"]');
            links.forEach(function(link) {
                if(link.innerText.includes('DIVE')) {
                    link.innerHTML = '<img src="/assets/images/logo.png" alt="DIVE" style="height: 45px; width: auto; object-fit: contain; margin-top: -5px;">';
                }
            });
        }
    });
</script>
