<style>
    /* 1. Kök Değişkenler (Anahtarları Altın Yapıyoruz) */
    :root {
        --primary-color: #B1976B !important;
        --theme-color: #B1976B !important;
        --main-color: #B1976B !important;
        --secondary-color: #B1976B !important;
        --color-primary: #B1976B !important;
    }

    /* 🎯 HEDEF 1: "EN" YAZISI VE DİL SEÇİCİ */
    .lang-switch, .lang-switch a, .language-selector, 
    .language-selector a, .header-lang, .header-lang a, 
    [class*="lang"] {
        color: #B1976B !important;
    }

    /* 🎯 HEDEF 2: BÜLTEN KUTUSU (Çerçeve, Zarf ve Abone Ol Butonu) */
    /* Çerçeve */
    .subscribe-form, .newsletter-box, .newsletter-wrapper, 
    .newsletter, .subscribe-wrapper, [class*="subscribe"], 
    [class*="newsletter"], .border-primary {
        border-color: #B1976B !important;
    }
    /* Zarf İkonu */
    .subscribe-form svg, .newsletter svg, .subscribe-wrapper svg, 
    [class*="subscribe"] svg, .newsletter-box i, .subscribe-form i {
        fill: #B1976B !important;
        color: #B1976B !important;
    }
    /* Abone Ol Butonu */
    .subscribe-form button, .newsletter button, .btn-primary, 
    [class*="subscribe"] button, [class*="newsletter"] .btn {
        background-color: #B1976B !important;
        border-color: #B1976B !important;
        color: #ffffff !important;
    }

    /* 🎯 HEDEF 3: "TÜMÜ" BUTONU VE AKTİF SEKMELER */
    .active, .is-active, .nav-link.active, .filter-button.active,
    .category-tag.active, .tag.active, .nav-pills .nav-link.active,
    .category-filter .active {
        background-color: #B1976B !important;
        border-color: #B1976B !important;
        color: #ffffff !important;
    }

    /* 🎯 HEDEF 4: MAKALE ALTINDAKİ KATEGORİ YAZILARI */
    .post-category, .category-name, a.category-link, 
    .article-category, .article-category a, .post-meta .category,
    .card-body .text-primary, .card-text .text-primary, 
    .card-body a, .card-body span {
        color: #B1976B !important;
    }

    /* 🛡️ KORUMA KALKANI: TEPEDEKİ BÜYÜTEÇ VE AY (ASLA BOZULMAYACAK) */
    .navbar button, .header button, 
    .nav-search-button, .dark-mode-toggle, 
    .search-toggle, .navbar-toggler {
        background: transparent !important; 
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 5px !important;
        color: #B1976B !important;
    }
    .navbar button svg, .header button svg,
    .nav-search-button svg, .dark-mode-toggle svg {
        width: 22px !important;
        height: 22px !important;
        fill: #B1976B !important;
        transition: all 0.3s ease;
    }
    .navbar button:hover svg, .header button:hover svg {
        transform: scale(1.1);
        fill: #C5A059 !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var logoElements = document.querySelectorAll('.site-title, .navbar-brand, .logo');
        if(logoElements.length > 0) {
            logoElements[0].innerHTML = '<img src="/assets/images/logo.png" alt="DIVE" style="height: 45px; width: auto; object-fit: contain; margin-top: -5px;">';
        } else {
            var links = document.querySelectorAll('a[href="/"]');
            links.forEach(function(link) {
                if(link.innerText.includes('DIVE')) {
                    link.innerHTML = '<img src="/assets/images/logo.png" alt="DIVE" style="height: 45px; width: auto; object-fit: contain; margin-top: -5px;">';
                }
            });
        }
    });
</script>
