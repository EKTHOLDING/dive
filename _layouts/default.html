<!DOCTYPE html>
<html lang="tr">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2959792438660398"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Psikoloji, üretkenlik ve zihinsel performans üzerine bilimsel temelli, derinlemesine içerikler.">
    <title>{{ page.title }} | DIVE</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z8XQWY4Y5W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z8XQWY4Y5W');
    </script>
    <script async defer data-pin-hover="true" data-pin-tall="true" src="//assets.pinterest.com/js/pinit.js"></script>
    
    <style>
        :root { --bg: #fafdfc; --text: #2c3e50; --primary: #2a9d8f; --footer-bg: #1a1a1a; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        
        a { text-decoration: none; color: inherit; }
        .footer-link { text-decoration: underline !important; color: #ffffff !important; font-weight: bold; }
        
        .header { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(255,255,255,0.98); z-index: 100; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 2px 15px rgba(42, 157, 143, 0.1); }
        .brand-container { display: flex; align-items: center; gap: 8px; font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: bold; }
        .logo-icon { color: var(--primary); }
        
        .main-content { flex: 1; margin-top: 100px; padding: 20px; max-width: 1000px; margin-left: auto; margin-right: auto; width: 100%; }
        
        .custom-footer { background: var(--footer-bg); color: #ffffff; padding: 60px 20px 30px; margin-top: 80px; text-align: left; }
    </style>
</head>
<body>

    <header class="header">
        <h1 style="margin:0; padding:0; line-height:1;">
            <a href="/" class="brand-container">
                <i class='bx bxs-spa logo-icon' aria-hidden="true"></i> DIVE
            </a>
        </h1>
    </header>

    <main class="main-content">
        {{ content }}
    </main>

    <footer class="custom-footer">
        <div style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 40px;">
            <div>
                <h2 style="font-family: 'Playfair Display', serif; margin-bottom: 20px; color: #ffffff; font-size: 1.5rem;">DIVE Hakkında</h2>
                <p style="color: #ffffff; font-size: 1.1rem; line-height: 1.6;">Psikoloji, üretkenlik ve zihinsel performans üzerine bilimsel temelli, derinlemesine içerikler.</p>
            </div>

            <div>
                <h2 style="margin-bottom: 20px; color: #2a9d8f; font-size: 1.2rem;">Kurumsal Bilgiler</h2>
                <ul style="list-style: none; padding: 0;">
                    <li style="margin-bottom: 15px;"><a href="/hakkimizda" class="footer-link">Hakkımızda</a></li>
                    <li style="margin-bottom: 15px;"><a href="/gizlilik-politikasi" class="footer-link">Gizlilik Politikası</a></li>
                    <li style="margin-bottom: 15px;"><a href="/iletisim" class="footer-link">İletişim</a></li>
                </ul>
            </div>
        </div>

        <div style="max-width: 1200px; margin: 40px auto 0; padding-top: 20px; border-top: 2px solid #ffffff; text-align: center; color: #ffffff; font-size: 1rem; font-weight: bold;">
            &copy; 2026 DIVE Medya. Tüm hakları saklıdır.
        </div>
    </footer>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' media="print" onload="this.media='all'">

</body>
</html>
