    <style>
        :root { --bg: #fafdfc; --text: #2c3e50; --primary: #2a9d8f; --footer-bg: #23303d; }
        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        
        .header { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(255,255,255,0.98); z-index: 100; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 2px 15px rgba(42, 157, 143, 0.1); }

        .logo-icon { color: var(--primary); }
        
        /* Makalelerin ve Sayfaların Oturacağı Alan */
        .main-content { flex: 1; margin-top: 100px; padding: 20px; max-width: 1000px; margin-left: auto; margin-right: auto; width: 100%; }
        
        .footer { background: var(--footer-bg); color: white; padding: 40px 20px; margin-top: auto; text-align: center; font-size: 0.9rem; opacity: 0.8;}
    </style>
